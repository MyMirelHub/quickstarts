apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master:6379
    - name: redisPassword
      secretKeyRef:
        name: redis
        key: redis-password
    - name: consumerID
      value: test-consumer
    - name: poolSize
      value: "30"              # Must be >= number of subscribed topics
    - name: poolTimeout
      value: "10s"             # Timeout for acquiring connection from pool
    - name: readTimeout
      value: "5s"              # Socket read timeout
    - name: writeTimeout
      value: "5s"              # Socket write timeout
    - name: maxConnAge
      value: "30m"             # Maximum connection age before recycling
auth:
  secretStore: kubernetes